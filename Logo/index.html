
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLUGINS - Botón 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #0c1014;
  overflow: hidden;
}

.stage {
  position: relative;
  width: 328px;
  height: 346px;
  flex: none;
  background: #0c1014;
}

/* ANILLO EXTERIOR */
.ring {
  position: absolute;
  width: 298px;
  height: 298px;
  left: 16px;
  top: 23px;
  border-radius: 50%;
  border: 12px solid #2b3036;
  background: #0c1014;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.4),
    inset 0 0 0 1px rgba(0,0,0,.25);
}

/* DISCO INTERIOR */
.disc {
  position: absolute;
  left: 41px;
  top: 47px;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 67% 13%,
      rgba(67, 30, 91, .45) 0%,
      rgba(47, 20, 69, .22) 35%,
      transparent 66%
    ),
    radial-gradient(
      ellipse at 24% 80%,
      rgba(63, 30, 43, .40) 0%,
      transparent 58%
    ),
    linear-gradient(
      180deg,
      #281139 0%,
      #210d30 44%,
      #25102e 68%,
      #351b2a 100%
    );
}

/* REFLEJO AMBIENTAL DEL DISCO */
.disc::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(
      ellipse at 50% -8%,
      rgba(104, 55, 132, .17),
      transparent 66%
    ),
    linear-gradient(
      160deg,
      rgba(76, 37, 100, .13),
      transparent 43%,
      rgba(8, 5, 15, .12) 100%
    );
}

/* OSCURECIMIENTO INFERIOR */
.disc::after {
  content: "";
  position: absolute;
  inset: 45% 0 0;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(48, 19, 37, .13) 42%,
    rgba(65, 31, 39, .25) 100%
  );
  pointer-events: none;
}

/* TEXTO SVG */
.txt {
  position: absolute;
  inset: 0;
  width: 328px;
  height: 346px;
  overflow: visible;
}

/* POSICIÓN Y FORMA DE LAS LETRAS */
.plugin-text {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 58px;
  font-weight: 700;
  letter-spacing: -1.5px;
}

/* ADAPTACIÓN A PANTALLAS PEQUEÑAS */
@media (max-width: 328px) {
  .stage {
    transform: scale(calc(100vw / 328));
    transform-origin: center center;
  }
}
</style>
</head>

<body>

<main class="stage" aria-label="PLUGINS">

  <div class="ring"></div>
  <div class="disc"></div>

  <svg
    class="txt"
    viewBox="0 0 328 346"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="PLUGINS"
  >
    <defs>

      <!-- COLOR PRINCIPAL CON REFLEJO SUPERIOR -->
      <linearGradient
        id="front"
        x1="0" y1="0"
        x2="0" y2="1"
      >
        <stop offset="0%" stop-color="#d49aff"/>
        <stop offset="15%" stop-color="#c17af5"/>
        <stop offset="38%" stop-color="#ad63eb"/>
        <stop offset="66%" stop-color="#a353df"/>
        <stop offset="86%" stop-color="#9548d4"/>
        <stop offset="100%" stop-color="#7934b8"/>
      </linearGradient>

      <!-- PROFUNDIDAD LATERAL 3D -->
      <linearGradient
        id="side"
        x1="0" y1="0"
        x2="0" y2="1"
      >
        <stop offset="0%" stop-color="#71369e"/>
        <stop offset="40%" stop-color="#582078"/>
        <stop offset="100%" stop-color="#351248"/>
      </linearGradient>

      <!-- BORDE OSCURO DEL BISEL -->
      <linearGradient
        id="bevel"
        x1="0" y1="0"
        x2="0" y2="1"
      >
        <stop offset="0%" stop-color="#e6baff"/>
        <stop offset="35%" stop-color="#b86bf0"/>
        <stop offset="100%" stop-color="#7132a5"/>
      </linearGradient>

      <!-- LUZ Y SOMBRA DEL TEXTO -->
      <filter
        id="textShadow"
        x="-20%" y="-40%"
        width="140%" height="190%"
      >
        <feGaussianBlur
          in="SourceAlpha"
          stdDeviation="3.2"
          result="shadowBlur"
        />
        <feOffset
          in="shadowBlur"
          dx="0" dy="2"
          result="shadowOffset"
        />
        <feFlood
          flood-color="#a64cff"
          flood-opacity=".48"
          result="shadowColor"
        />
        <feComposite
          in="shadowColor"
          in2="shadowOffset"
          operator="in"
          result="shadow"
        />
        <feMerge>
          <feMergeNode in="shadow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- REFLEJO BRILLANTE DEL BISEL -->
      <linearGradient
        id="highlight"
        x1="0" y1="0"
        x2="0" y2="1"
      >
        <stop offset="0%" stop-color="#f0d3ff"/>
        <stop offset="35%" stop-color="#d9a2ff"/>
        <stop offset="100%" stop-color="#a45be2"/>
      </linearGradient>

    </defs>

    <!-- SOMBRA DE CONTACTO -->
    <text
      x="164" y="194"
      text-anchor="middle"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      class="plugin-text"
      fill="#190b25"
      opacity=".85"
    >PLUGINS</text>

    <!-- EXTRUSIÓN 3D: CAPAS DESPLAZADAS -->
    <g
      class="plugin-text"
      text-anchor="middle"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      fill="url(#side)"
    >
      <text x="164" y="193">PLUGINS</text>
      <text x="164" y="194">PLUGINS</text>
      <text x="164" y="195">PLUGINS</text>
      <text x="164" y="196">PLUGINS</text>
    </g>

    <!-- CARA FRONTAL CON LUMINOSIDAD -->
    <text
      x="164" y="191"
      text-anchor="middle"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      class="plugin-text"
      fill="url(#front)"
      filter="url(#textShadow)"
    >PLUGINS</text>

    <!-- BORDE SUPERIOR ILUMINADO -->
    <text
      x="164" y="191"
      text-anchor="middle"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      class="plugin-text"
      fill="none"
      stroke="url(#highlight)"
      stroke-width="1.1"
      opacity=".8"
    >PLUGINS</text>

    <!-- BRILLO FINO INTERIOR -->
    <text
      x="164" y="190.5"
      text-anchor="middle"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      class="plugin-text"
      fill="none"
      stroke="#f0ceff"
      stroke-width=".45"
      opacity=".65"
    >PLUGINS</text>

  </svg>
</main>

</body>
</html>
